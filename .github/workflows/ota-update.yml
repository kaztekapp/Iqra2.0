name: OTA Update

# A push to main only runs the checks. An over-the-air update is published
# only when someone presses "Run workflow" (Actions → OTA Update), because
# every update counts its downloaders toward Expo's monthly-user bill.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: What this update changes (shown in Expo)
        required: false
        default: Manual OTA update

# One publish at a time, in order: two overlapping runs once let an older
# update finish after a newer one and become the live version. Only the
# publishes queue together: GitHub keeps one waiting run per group, so a push
# in the same group used to cancel a publish that was waiting its turn.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'ota-publish' || format('ota-checks-{0}', github.sha) }}
  cancel-in-progress: false

jobs:
  update:
    name: Checks, and the update when run by hand
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # eas-cli 22+ requires Node >= 22 (@oclif/plugin-autocomplete engine).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nothing ships unless it typechecks, lints and passes the tests.
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npx eslint .
      - name: Test
        run: npx jest --ci

      - name: Setup EAS
        if: github.event_name == 'workflow_dispatch'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --environment pulls the server-side EAS environment variables
      # (EXPO_PUBLIC_SUPABASE_URL/ANON_KEY, etc.) at bundle time. Without it, CI
      # has no .env (gitignored) so those inline as empty and the published OTA
      # ships with Supabase unconfigured, breaking sign-in.
      - name: Publish update (production)
        if: github.event_name == 'workflow_dispatch'
        run: eas update --branch production --environment production --message "${MESSAGE:-Manual OTA update}" --non-interactive
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MESSAGE: ${{ inputs.message }}

      # Also publish to the preview branch so internal preview builds
      # (channel: preview) receive the same OTA and can be tested.
      - name: Publish update (preview)
        if: github.event_name == 'workflow_dispatch'
        run: eas update --branch preview --environment preview --message "${MESSAGE:-Manual OTA update}" --non-interactive
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MESSAGE: ${{ inputs.message }}
